<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Simple, secure passwordless sign-in.">
  <title>Sign in · Your App</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="auth-card">
    <div class="brand-mark" aria-hidden="true">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
        <path d="M13.2 2.8 4.7 13h6l-.9 8.2L19.3 10h-6.1l0-7.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>

    <section id="loginView">
      <p class="eyebrow">YOUR APP</p>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in securely with a magic link sent to your email.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com"
               autocomplete="email" required>
        <button id="submitBtn" type="submit">
          <span class="button-label">Email me a magic link</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <p class="helper">No password required. Check your inbox for your sign-in link.</p>
    </section>

    <section id="signedView" hidden>
      <p class="eyebrow">ACCOUNT</p>
      <h1>You’re signed in</h1>
      <p id="signedEmail" class="subtitle"></p>
      <div class="account-panel">
        <span class="account-dot" aria-hidden="true"></span>
        <span>Your session is active on this device.</span>
      </div>
      <button id="signOutBtn" class="button-secondary" type="button">Sign out</button>
    </section>

    <footer>Secure authentication powered by Supabase</footer>
  </main>
</body>
</html>
